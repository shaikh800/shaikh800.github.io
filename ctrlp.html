<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl-P | Print Service</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .order-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #10b981; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .submit-btn { width: 100%; background: #10b981; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #059669; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="order-card">
        <h2>🖨️ Ctrl-P Print Order</h2>
        <form>
            <div class="input-group">
                <label>Upload File (PDF/Doc)</label>
                <input type="file" required>
            </div>
            <div class="input-group">
                <label>Paper Size</label>
                <select>
                    <option>A4 Size</option>
                    <option>Legal Size</option>
                    <option>A3 (Blueprints)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Print Type</label>
                <select>
                    <option>Black & White</option>
                    <option>Color Print</option>
                </select>
            </div>
            <div class="input-group">
                <label>Instructions (Optional)</label>
                <textarea rows="3" placeholder="Jemon: 2 copies, double sided..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Place Order</button>
        </form>
        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>
</body>
</html>
