<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Online Exam Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --blue:#2563eb; --blue-dark:#1d4ed8;
  --ink:#0f172a; --muted:#64748b;
  --surface:#ffffff; --surface-soft:#f8fafc;
  --line:#e2e8f0; --radius:10px; --radius-lg:20px;
  --shadow:0 10px 30px rgba(15,23,42,0.06);
}
* { box-sizing: border-box; }
body {
  background: #f1f5f9; font-family: 'Noto Serif Bengali', sans-serif;
  margin: 0; padding: 12px; color: var(--ink);
}
.container { max-width: 650px; margin: 0 auto; }
.card {
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 24px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.btn {
  width: 100%; padding: 14px; background: var(--blue); color: white;
  border: none; border-radius: var(--radius); font-size: 16px;
  font-weight: 700; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--blue-dark); }
.input-f {
  width: 100%; padding: 12px; border: 1px solid var(--line);
  border-radius: var(--radius); margin-top: 6px; margin-bottom: 16px;
  font-size: 15px; font-family: inherit;
}
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; background: var(--ink); color: white;
  padding: 12px 16px; border-radius: var(--radius);
}
.q-card { margin-bottom: 14px; padding: 18px; }
.q-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.opt-label {
  display: flex; align-items: center; gap: 10px; padding: 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  margin-bottom: 8px; cursor: pointer; transition: 0.2s;
}
.opt-label:hover { background: var(--surface-soft); }
input[type="radio"] { width: 18px; height: 18px; margin: 0; }
#timer { font-weight: 700; font-size: 18px; color: #f59e0b; }
.alert-box {
  background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
  padding: 12px; border-radius: var(--radius); margin-bottom: 16px; display: none;
}
</style>
</head>
<body>

<div class="container">
  <div id="loading-state" class="card" style="text-align:center; padding:40px;">
    <i class="fas fa-circle-notch fa-spin" style="font-size:32px; color:var(--blue);"></i>
    <p style="margin-top:16px; color:var(--muted);">পরীক্ষার ডেটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
  </div>

  <div id="no-id-state" class="card" style="display:none; text-align:center;"></div>

  <div id="login-screen" class="card" style="display:none;">
    <h2 id="portal-title" style="margin-top:0; margin-bottom:6px; text-align:center;">অনলাইন পরীক্ষা</h2>
    <p id="portal-duration" style="text-align:center; color:var(--muted); margin-bottom:24px; font-weight:700;"></p>
    
    <div id="login-alert" class="alert-box"></div>

    <label>আপনার নাম লিখুন <span>*</span></label>
    <input type="text" id="uname" class="input-f" placeholder="e.g. Md. Shaikh Alam">

    <label>স্টুডেন্ট আইডি <span>*</span></label>
    <input type="text" id="uid" class="input-f" placeholder="e.g. 101">

    <label>পরীক্ষার অ্যাক্সেস পাসওয়ার্ড <span>*</span></label>
    <input type="password" id="upass" class="input-f" placeholder="🔑 Enter Exam Password">

    <button class="btn" onclick="verifyAndStart()"><i class="fas fa-play"></i> পরীক্ষা শুরু করুন</button>
  </div>

  <div id="exam-screen" style="display:none;">
    <div class="top-bar">
      <span id="live-student-info" style="font-weight:700;"></span>
      <div id="timer">00:00</div>
    </div>
    <div id="questions-area"></div>
    <button class="btn" onclick="submitExam()" style="background:#10b981;"><i class="fas fa-check-circle"></i> উত্তরপত্র জমা দিন</button>
  </div>

  <div id="summary-screen" class="card" style="display:none; text-align:center;">
    <h2 style="color:#10b981; margin-top:0;"><i class="fas fa-trophy"></i> পরীক্ষা সম্পন্ন হয়েছে!</h2>
    <div style="font-size:48px; font-weight:800; margin:20px 0;" id="score-display">0 / 0</div>
    <p id="status-text" style="color:var(--muted); font-size:16px; margin-bottom:24px;"></p>
    <button class="btn" onclick="location.reload()" style="background:var(--ink);"><i class="fas fa-redo"></i> রিফ্রেশ করুন</button>
  </div>
</div>

<script>
let examData = null;
let qd = [];
let userAnswers = {};
let tInt = null;
const urlParams = new URLSearchParams(window.location.search);
const examId = urlParams.get('examId');

window.onload = async () => {
  if(!examId) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('no-id-state').innerHTML = `<h3>Invalid URL</h3><p>কোনো পরীক্ষার আইডি পাওয়া যায়নি।</p>`;
    document.getElementById('no-id-state').style.display = 'block';
    return;
  }

  try {
    // 1st Fetch: Try GitHub Raw JSON
    let res = await fetch(`https://raw.githubusercontent.com/shaikh800/shaikh800.github.io/main/civil_data.json?_=${Date.now()}`);
    let data = res.ok ? await res.json() : null;
    let foundExam = data ? (data.exams || []).find(e => e.id === examId) : null;

    // 2nd Fetch: Fallback directly to GitHub API if raw CDN is delayed
    if (!foundExam) {
      const apiRes = await fetch(`https://api.github.com/repos/shaikh800/shaikh800.github.io/contents/civil_data.json?_=${Date.now()}`);
      if (apiRes.ok) {
        const apiData = await apiRes.json();
        const decodedContent = decodeURIComponent(escape(atob(apiData.content)));
        const freshData = JSON.parse(decodedContent);
        foundExam = (freshData.exams || []).find(e => e.id === examId);
      }
    }

    if (!foundExam) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('no-id-state').innerHTML = `<h3 style='color:#ef4444;'>Exam Not Found</h3><p>এই আইডি দিয়ে কোনো পরীক্ষা তৈরি হয়নি অথবা আপডেটের কাজ চলছে।</p>`;
      document.getElementById('no-id-state').style.display = 'block';
      return;
    }

    examData = foundExam.examData;
    qd = examData.questions || [];

    // Initialize Login UI
    document.getElementById('portal-title').innerText = examData.title;
    document.getElementById('portal-duration').innerText = `সময়সীমা: ${examData.duration}`;
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';

  } catch(e) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('no-id-state').innerHTML = `<h3>Connection Error</h3><p>সার্ভার থেকে ডেটা আনতে সমস্যা হচ্ছে।</p>`;
    document.getElementById('no-id-state').style.display = 'block';
  }
};

function verifyAndStart() {
  const uname = document.getElementById("uname").value.trim();
  const uid = document.getElementById("uid").value.trim();
  const upass = document.getElementById("upass").value.trim();
  const alertBox = document.getElementById("login-alert");

  alertBox.style.display = "none";

  if(!uname) { alertBox.innerText = "আপনার নাম লিখুন!"; alertBox.style.display = "block"; return; }
  if(!uid) { alertBox.innerText = "আপনার স্টুডেন্ট আইডি দিন!"; alertBox.style.display = "block"; return; }

  // Admin Security Validations
  const targetPassword = examData.password || "";
  const allowedIds = examData.allowedIds || [];

  if(targetPassword && upass !== targetPassword) {
    alertBox.innerText = "পরীক্ষার পাসওয়ার্ড ভুল হয়েছে!";
    alertBox.style.display = "block";
    return;
  }

  if(allowedIds.length > 0 && !allowedIds.includes(uid)) {
    alertBox.innerText = "দুঃখিত, আপনার স্টুডেন্ট আইডিটি এই পরীক্ষার তালিকায় অনুমোদিত নয়!";
    alertBox.style.display = "block";
    return;
  }

  // Pass validations, start the exam
  document.getElementById("live-student-info").innerText = `পরীক্ষার্থী: ${uname} (ID: ${uid})`;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("exam-screen").style.display = "block";

  renderQuestions();
  startTimer(parseInt(examData.duration) || 30);
}

function renderQuestions() {
  const container = document.getElementById("questions-area");
  let html = '';
  qd.forEach((q, qIndex) => {
    html += `
      <div class="card q-card">
        <div class="q-title">${qIndex + 1}. ${q.q}</div>
        <div>
          ${q.opts.map((opt, oIndex) => `
            <label class="opt-label">
              <input type="radio" name="q_${qIndex}" value="${oIndex}" onclick="userAnswers[${qIndex}]=${oIndex}">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function startTimer(minutes) {
  let timeRemaining = minutes * 60;
  tInt = setInterval(() => {
    timeRemaining--;
    let m = Math.floor(timeRemaining / 60);
    let s = timeRemaining % 60;
    document.getElementById("timer").innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    if(timeRemaining <= 0) {
      clearInterval(tInt);
      submitExam();
    }
  }, 1000);
}

function submitExam() {
  clearInterval(tInt);
  let score = 0;
  qd.forEach((q, index) => {
    if(userAnswers[index] !== undefined && userAnswers[index] === q.ans) {
      score++;
    }
  });

  document.getElementById("score-display").innerText = `${score} / ${qd.length}`;
  document.getElementById("status-text").innerText = `মোট প্রশ্ন সংখ্যা ${qd.length} টির মধ্যে আপনার ${score} টি সঠিক হয়েছে।`;

  document.getElementById("exam-screen").style.display = "none";
  document.getElementById("summary-screen").style.display = "block";
}
</script>
</body>
</html>
