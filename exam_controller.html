<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Exam Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--ink:#0f172a;--muted:#64748b;--surface:#ffffff;--surface-soft:#f8fafc;--line:#e2e8f0;--radius:10px;--radius-lg:16px;--shadow:0 4px 16px rgba(15,23,42,0.07);}
*{box-sizing:border-box;}
body{background:#f1f5f9;font-family:'Noto Serif Bengali',sans-serif;margin:0;padding:20px;color:var(--ink);}
.container{max-width:900px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--line);}
.header h1{margin:0;font-size:24px;color:var(--ink);}
.panel{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;border:1px solid var(--line);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius);font-weight:bold;cursor:pointer;border:none;font-size:14px;transition:0.2s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-danger{background:#ef4444;color:#fff;}
.btn-secondary{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line);}
.input-f{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-soft);margin-bottom:12px;font-family:inherit;}
.input-f:focus{border-color:var(--blue);outline:none;background:var(--surface);}
label{font-size:12px;font-weight:bold;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block;}
.exam-card{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;transition:0.2s;}
.exam-card:hover{border-color:var(--blue);}
.exam-info h3{margin:0 0 4px;font-size:16px;}
.exam-info p{margin:0;font-size:13px;color:var(--muted);}
.exam-actions{display:flex;gap:8px;}
#builder-section{display:none;}
.q-block{background:var(--surface-soft);padding:16px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;position:relative;}
.q-block h4{margin:0 0 12px;font-size:14px;color:var(--blue);}
.remove-q-btn{position:absolute;top:16px;right:16px;color:#ef4444;cursor:pointer;background:none;border:none;font-size:14px;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:50px;font-size:14px;display:none;z-index:1000;box-shadow:var(--shadow);}
#loader{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-file-signature"></i> Exam Controller</h1>
    <div style="display:flex;gap:10px;align-items:center;">
      <input type="password" id="gh-token" class="input-f" style="margin:0;width:200px;padding:8px 12px;" placeholder="GitHub Token" autocomplete="off">
      <button class="btn btn-secondary" onclick="loadExamsFromGitHub()"><i class="fas fa-sync"></i> Sync</button>
    </div>
  </div>
  <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Loading data...</p></div>
  <div id="dashboard-section" style="display:none;">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;font-size:18px;">Manage Exams</h2>
        <button class="btn btn-primary" onclick="openBuilder()"><i class="fas fa-plus"></i> Create New</button>
      </div>
      <div id="exam-list"></div>
    </div>
  </div>
  <div id="builder-section">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="margin:0;font-size:18px;">Exam Builder</h2>
        <button class="btn btn-secondary" onclick="closeBuilder()"><i class="fas fa-arrow-left"></i> Back</button>
      </div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;">
        <div><label>Exam Title</label><input type="text" id="exam-title" class="input-f" placeholder="Model Test 1"></div>
        <div><label>Duration (Minutes)</label><input type="number" id="exam-duration" class="input-f" placeholder="30"></div>
      </div>
      <div id="questions-container" style="margin-top:20px;"></div>
      <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-bottom:20px;border-style:dashed;" onclick="addQuestionBlock()"><i class="fas fa-plus"></i> Add Question</button>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn btn-primary" onclick="saveExam()"><i class="fas fa-cloud-upload-alt"></i> Save & Publish</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast">Message</div>
<script>
const GITHUB_OWNER='shaikh800';
const GITHUB_REPO='shaikh800.github.io';
const GITHUB_FILE='civil_data.json';
const GITHUB_BRANCH='main';
let fullGithubData={semesters:{},notices:[],exams:[],updated:""};
let questionCount=0;
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
function generateId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}
async function loadExamsFromGitHub(){
  document.getElementById('loader').style.display='block';
  document.getElementById('dashboard-section').style.display='none';
  document.getElementById('builder-section').style.display='none';
  const token=document.getElementById('gh-token').value.trim();
  if(token) sessionStorage.setItem('civil_gh_token',token);
  const url=`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE}?_=${Date.now()}`;
  try{
    const res=await fetch(url);
    if(res.ok){
      const data=await res.json();
      fullGithubData={semesters:data.semesters||{},notices:data.notices||[],exams:data.exams||[],updated:data.updated||""};
      renderExamList();
      showToast("Data loaded!");
    }else{
      showToast("Failed to fetch.");
    }
  }catch(e){
    showToast("Network error.");
  }
  document.getElementById('loader').style.display='none';
  document.getElementById('dashboard-section').style.display='block';
}
function renderExamList(){
  const list=document.getElementById('exam-list');
  if(fullGithubData.exams.length===0){
    list.innerHTML=`<p style="text-align:center;color:#64748b;">No exams found.</p>`;
    return;
  }
  list.innerHTML=fullGithubData.exams.map(ex=>`
    <div class="exam-card">
      <div class="exam-info">
        <h3>${ex.examData.title}</h3>
        <p><i class="far fa-clock"></i> ${ex.examData.duration} | <i class="fas fa-list-ol"></i> ${ex.examData.questions.length} Qs | ID: ${ex.id}</p>
      </div>
      <div class="exam-actions">
        <button class="btn btn-secondary" onclick="copyLink('${ex.id}')"><i class="fas fa-link"></i> Copy</button>
        <button class="btn btn-danger" onclick="deleteExam('${ex.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  `).join('');
}
function copyLink(id){
  const link=`https://mdshaikh.me/print/model_test.html?examId=${id}`;
  navigator.clipboard.writeText(link);
  showToast("Link copied!");
}
function openBuilder(){
  document.getElementById('dashboard-section').style.display='none';
  document.getElementById('builder-section').style.display='block';
  document.getElementById('exam-title').value='';
  document.getElementById('exam-duration').value='30';
  document.getElementById('questions-container').innerHTML='';
  questionCount=0;
  addQuestionBlock();
}
function closeBuilder(){
  document.getElementById('builder-section').style.display='none';
  document.getElementById('dashboard-section').style.display='block';
}
function addQuestionBlock(){
  questionCount++;
  const container=document.getElementById('questions-container');
  const div=document.createElement('div');
  div.className='q-block';
  div.id=`q-block-${questionCount}`;
  div.innerHTML=`
    <h4>Question ${questionCount}</h4>
    <button class="remove-q-btn" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
    <label>Question Text</label>
    <input type="text" class="input-f q-title" placeholder="Type question...">
    <label>Options</label>
    <div class="options-grid">
      <input type="text" class="input-f opt-0" placeholder="Option A (0)">
      <input type="text" class="input-f opt-1" placeholder="Option B (1)">
      <input type="text" class="input-f opt-2" placeholder="Option C (2)">
      <input type="text" class="input-f opt-3" placeholder="Option D (3)">
    </div>
    <label>Correct Answer Index</label>
    <select class="input-f correct-ans">
      <option value="0">Option A (0)</option>
      <option value="1">Option B (1)</option>
      <option value="2">Option C (2)</option>
      <option value="3">Option D (3)</option>
    </select>
  `;
  container.appendChild(div);
}
async function saveExam(){
  const token=document.getElementById('gh-token').value.trim()||sessionStorage.getItem('civil_gh_token');
  if(!token) return showToast("Token required!");
  const title=document.getElementById('exam-title').value.trim();
  const duration=document.getElementById('exam-duration').value.trim();
  if(!title) return showToast("Title required!");
  const qBlocks=document.querySelectorAll('.q-block');
  const questions=[];
  let valid=true;
  qBlocks.forEach(block=>{
    const qText=block.querySelector('.q-title').value.trim();
    const o0=block.querySelector('.opt-0').value.trim();
    const o1=block.querySelector('.opt-1').value.trim();
    const o2=block.querySelector('.opt-2').value.trim();
    const o3=block.querySelector('.opt-3').value.trim();
    const ans=parseInt(block.querySelector('.correct-ans').value);
    if(!qText||!o0||!o1||!o2||!o3) valid=false;
    questions.push({q:qText,opts:[o0,o1,o2,o3],ans:ans});
  });
  if(!valid) return showToast("Fill all options!");
  const newExam={id:generateId(),date:new Date().toISOString(),examData:{title:title,duration:duration+" minutes",questions:questions}};
  fullGithubData.exams.unshift(newExam);
  await pushToGitHub(token);
  closeBuilder();
}
async function deleteExam(id){
  if(!confirm("Delete?")) return;
  const token=document.getElementById('gh-token').value.trim()||sessionStorage.getItem('civil_gh_token');
  if(!token) return showToast("Token required!");
  fullGithubData.exams=fullGithubData.exams.filter(ex=>ex.id!==id);
  await pushToGitHub(token);
}
async function pushToGitHub(token){
  const btn=document.querySelector('.btn-primary');
  const originalText=btn.innerHTML;
  btn.innerHTML=`<i class="fas fa-spinner fa-spin"></i> Saving...`;
  btn.disabled=true;
  fullGithubData.updated=new Date().toISOString();
  try{
    const apiUrl=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
    let sha=null;
    const g=await fetch(apiUrl,{headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
    if(g.ok){
      const j=await g.json();
      sha=j.sha;
    }
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(fullGithubData,null,2))));
    const put=await fetch(apiUrl,{
      method:'PUT',
      headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'Update exams via Controller',content,...(sha?{sha}:{})})
    });
    if(put.ok){
      showToast("Synced!");
      renderExamList();
    }else{
      showToast("Push failed.");
    }
  }catch(e){
    showToast("Network error.");
  }
  btn.innerHTML=originalText;
  btn.disabled=false;
}
window.onload=()=>{
  const savedToken=sessionStorage.getItem('civil_gh_token');
  if(savedToken){
    document.getElementById('gh-token').value=savedToken;
    loadExamsFromGitHub();
  }else{
    document.getElementById('dashboard-section').style.display='block';
    document.getElementById('loader').style.display='none';
  }
};
</script>
</body>
</html>
