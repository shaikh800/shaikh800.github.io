<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Exam Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">
<style>
:root{--blue:#2563eb;--blue-dark:#1d4ed8;--ink:#0f172a;--muted:#64748b;--surface:#ffffff;--surface-soft:#f8fafc;--line:#e2e8f0;--radius:10px;--radius-lg:16px;--shadow:0 4px 16px rgba(15,23,42,0.07);}
*{box-sizing:border-box;}
body{background:#f1f5f9;font-family:'Noto Serif Bengali',sans-serif;margin:0;padding:20px;color:var(--ink);}\n.container{max-width:900px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--line);}
.header h1{margin:0;font-size:24px;}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);margin-bottom:20px;}
.btn{padding:10px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-family:inherit;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-secondary{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line);}
.input-f{width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--radius);margin-top:6px;margin-bottom:14px;font-family:inherit;font-size:14px;}
.input-f:focus{outline:2px solid var(--blue);border-color:transparent;}
label{font-weight:700;font-size:14px;color:var(--ink);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.q-block{background:var(--surface-soft);padding:16px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:16px;position:relative;}
.remove-q{position:absolute;top:16px;right:16px;color:#ef4444;cursor:pointer;}
.exam-item{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);}
.exam-item:last-child{border-bottom:none;}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 24px;border-radius:var(--radius);display:none;z-index:1000;}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Exam Controller Panel</h1>
    <div id="auth-status"></div>
  </div>

  <div id="dashboard-section" class="card">
    <div style="margin-bottom:16px;display:flex;gap:10px;">
      <input type="password" id="gh-token" class="input-f" style="margin:0;" placeholder="Enter GitHub Personal Access Token...">
      <button class="btn btn-primary" onclick="saveToken()">Connect</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;margin-bottom:10px;">
      <h2>All Exams</h2>
      <button class="btn btn-primary" onclick="openBuilder()"><i class="fas fa-plus"></i> Create New Exam</button>
    </div>
    <div id="exam-list">Loading exams...</div>
  </div>

  <div id="builder-section" class="card" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2>Create MCQ Exam</h2>
      <button class="btn btn-secondary" onclick="closeBuilder()">Back to Dashboard</button>
    </div>

    <div class="grid-2">
      <div><label>Exam Title</label><input type="text" id="exam-title" class="input-f" placeholder="e.g. Structural Analysis Quiz"></div>
      <div><label>Duration (Minutes)</label><input type="number" id="exam-duration" class="input-f" value="30"></div>
    </div>

    <div class="grid-2">
      <div><label>Exam Password</label><input type="text" id="exam-pass" class="input-f" placeholder="e.g. fec123 (Faka rakhle password lagbe na)"></div>
      <div><label>Allowed Student IDs (Comma separated)</label><input type="text" id="exam-ids" class="input-f" placeholder="e.g. 101, 102, 105 (Faka rakhle jekeu dite parbe)"></div>
    </div>

    <div id="questions-container" style="margin-top:10px;"></div>

    <div style="display:flex;justify-content:space-between;margin-top:20px;">
      <button class="btn btn-secondary" onclick="addQuestionBlock()"><i class="fas fa-plus"></i> Add Question</button>
      <button class="btn btn-primary" onclick="saveExam()"><i class="fas fa-save"></i> Save & Sync to GitHub</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const GITHUB_OWNER = 'shaikh800';
const GITHUB_REPO = 'shaikh800.github.io';
const GITHUB_FILE = 'civil_data.json';

let fullGithubData = { semesters: {}, notices: [], exams: [] };
let questionCount = 0;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function saveToken() {
  const token = document.getElementById('gh-token').value.trim();
  if(!token) return showToast("Token cannot be empty!");
  sessionStorage.setItem('civil_gh_token', token);
  showToast("Token Saved!");
  loadExams();
}

async function loadExams() {
  const token = sessionStorage.getItem('civil_gh_token') || document.getElementById('gh-token').value.trim();
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE}?_=${Date.now()}`);
    if(res.ok) {
      const data = await res.json();
      fullGithubData = data;
      if(!fullGithubData.exams) fullGithubData.exams = [];
    }
    renderExamList();
  } catch(e) {
    document.getElementById('exam-list').innerText = "Failed to load data file.";
  }
}

function renderExamList() {
  const container = document.getElementById('exam-list');
  if(!fullGithubData.exams || fullGithubData.exams.length === 0) {
    container.innerHTML = "<p style='color:var(--muted);'>No exams found. Click 'Create New Exam' to add one.</p>";
    return;
  }
  let html = '';
  fullGithubData.exams.forEach((ex) => {
    const liveLink = `https://mdshaikh.me/print/model_test.html?examId=${ex.id}`;
    html += `
      <div class="exam-item">
        <div>
          <strong>${ex.examData.title}</strong> <span style="color:var(--muted);font-size:12px;">(${ex.examData.duration})</span><br>
          <small style="color:var(--blue);word-break:break-all;">${liveLink}</small>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${liveLink}');showToast('Link Copied!')"><i class="fas fa-copy"></i></button>
          <button class="btn btn-secondary" style="color:#ef4444;" onclick="deleteExam('${ex.id}')"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function openBuilder() {
  document.getElementById('dashboard-section').style.display = 'none';
  document.getElementById('builder-section').style.display = 'block';
  document.getElementById('exam-title').value = '';
  document.getElementById('exam-duration').value = '30';
  document.getElementById('exam-pass').value = '';
  document.getElementById('exam-ids').value = '';
  document.getElementById('questions-container').innerHTML = '';
  questionCount = 0;
  addQuestionBlock();
}

function closeBuilder() {
  document.getElementById('dashboard-section').style.display = 'block';
  document.getElementById('builder-section').style.display = 'none';
}

function addQuestionBlock() {
  questionCount++;
  const container = document.getElementById('questions-container');
  const div = document.createElement('div');
  div.className = 'q-block';
  div.id = `q-block-${questionCount}`;
  div.innerHTML = `
    <i class="fas fa-trash remove-q" onclick="this.parentElement.remove()"></i>
    <label>Question ${questionCount}</label>
    <input type="text" class="input-f q-title" placeholder="Enter question description">
    <div class="grid-2">
      <div><label>Option 1</label><input type="text" class="input-f opt-0" placeholder="Option 1"></div>
      <div><label>Option 2</label><input type="text" class="input-f opt-1" placeholder="Option 2"></div>
      <div><label>Option 3</label><input type="text" class="input-f opt-2" placeholder="Option 3"></div>
      <div><label>Option 4</label><input type="text" class="input-f opt-3" placeholder="Option 4"></div>
    </div>
    <label>Correct Answer Index</label>
    <select class="input-f correct-ans">
      <option value="0">Option 1</option>
      <option value="1">Option 2</option>
      <option value="2">Option 3</option>
      <option value="3">Option 4</option>
    </select>
  `;
  container.appendChild(div);
}

async function saveExam() {
  const token = sessionStorage.getItem('civil_gh_token') || document.getElementById('gh-token').value.trim();
  if(!token) return showToast("Please enter and connect your GitHub token first!");

  const title = document.getElementById('exam-title').value.trim();
  const duration = document.getElementById('exam-duration').value.trim();
  const examPass = document.getElementById('exam-pass').value.trim();
  const allowedIdsStr = document.getElementById('exam-ids').value.trim();

  const allowedIds = allowedIdsStr ? allowedIdsStr.split(',').map(id => id.trim()) : [];

  if(!title) return showToast("Exam Title is required!");

  const qBlocks = document.querySelectorAll('.q-block');
  const questions = [];
  let valid = true;

  qBlocks.forEach(block => {
    const qText = block.querySelector('.q-title').value.trim();
    const o0 = block.querySelector('.opt-0').value.trim();
    const o1 = block.querySelector('.opt-1').value.trim();
    const o2 = block.querySelector('.opt-2').value.trim();
    const o3 = block.querySelector('.opt-3').value.trim();
    const ans = parseInt(block.querySelector('.correct-ans').value);

    if(!qText || !o0 || !o1 || !o2 || !o3) valid = false;
    questions.push({ q: qText, opts: [o0, o1, o2, o3], ans: ans });
  });

  if(!valid) return showToast("Please fill all questions and option fields!");

  const newExam = {
    id: 'ex_' + Math.random().toString(36).substr(2, 9),
    date: new Date().toISOString(),
    examData: {
      title: title,
      duration: duration + " minutes",
      password: examPass,
      allowedIds: allowedIds,
      questions: questions
    }
  };

  fullGithubData.exams.unshift(newExam);
  await pushToGitHub(token);
  closeBuilder();
}

async function deleteExam(id) {
  if(!confirm("Are you sure you want to delete this exam?")) return;
  const token = sessionStorage.getItem('civil_gh_token');
  if(!token) return showToast("Token required to delete!");

  fullGithubData.exams = fullGithubData.exams.filter(e => e.id !== id);
  await pushToGitHub(token);
}

async function pushToGitHub(token) {
  const btn = document.querySelector('.btn-primary');
  const originalText = btn.innerHTML;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Syncing...`;
  btn.disabled = true;

  fullGithubData.updated = new Date().toISOString();

  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
    let sha = null;
    const g = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
    if(g.ok) {
      const j = await g.json();
      sha = j.sha;
    }
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(fullGithubData, null, 2))));
    const put = await fetch(apiUrl, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify({ message: 'Update exams via Controller', content, ...(sha ? { sha } : {}) })
    });

    if(put.ok) {
      showToast("Successfully Saved & Synced!");
      renderExamList();
    } else {
      showToast("GitHub push failed.");
    }
  } catch(e) {
    showToast("Network profile error.");
  }
  btn.innerHTML = originalText;
  btn.disabled = false;
}

window.onload = () => {
  const savedToken = sessionStorage.getItem('civil_gh_token');
  if(savedToken) {
    document.getElementById('gh-token').value = savedToken;
    loadExams();
  }
};
</script>
</body>
</html>
