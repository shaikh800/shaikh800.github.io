<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Shaikh | Portfolio</title>
    <style>
        :root {
            --primary: #3b82f6; 
            --success: #10b981; 
            --glass-bg: rgba(15, 23, 42, 0.7);
            --text-main: #f8fafc;
        }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: var(--text-main); }

        .hero-section {
            position: relative;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1541888086425-d81bb19240f5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.6) 100%); z-index: 1; }

        .content-wrapper {
            position: relative; z-index: 2; background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
            padding: 60px 40px; max-width: 850px; width: 90%; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 3.5rem; margin-bottom: 10px; background: linear-gradient(to right, #fff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }

        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 14px 30px; border-radius: 50px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        
        .btn-print { background: var(--success); color: white; }
        .btn-print:hover { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4); }
        
        .btn-secondary { border: 1px solid rgba(255,255,255,0.2); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="overlay"></div>
        <div class="content-wrapper">
            <h1>Md. Shaikh</h1>
            <p>Civil Engineering Student & Creative Developer. I build tools to make digital workflows easier.</p>
            
            <div class="btn-group">
                <a href="ctrlp.html" class="btn btn-print">🖨️ Ctrl-P Print Order</a>
                <a href="./print/mcq-builder.html" class="btn btn-secondary">Question Builder</a>
            </div>
        </div>
    </section>
</body>
</html>
