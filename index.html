<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Shaikh | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0f1a; --card-bg: #161e2d; --accent: #3b82f6; --text-main: #f8fafc; --text-dim: #94a3b8; --border: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        
        .sidebar-trigger { position: fixed; top: 25px; left: 25px; z-index: 1001; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: #0f172a; border-right: 1px solid var(--border); padding: 100px 30px; transition: 0.4s; z-index: 1000; text-align: left; }
        .sidebar.active { left: 0; }
        .nav-menu { list-style: none; }
        .nav-menu li { margin-bottom: 25px; }
        .nav-menu a { text-decoration: none; color: var(--text-dim); font-size: 17px; display: flex; align-items: center; transition: 0.3s; }
        .nav-menu a:hover { color: var(--accent); transform: translateX(10px); }
        .nav-menu i { margin-right: 15px; width: 20px; }

        .container { max-width: 800px; padding: 40px; }
        h1 { font-size: 52px; font-weight: 800; margin-bottom: 10px; }
        h1 span { color: var(--accent); }
        p.subtitle { color: var(--text-dim); font-size: 19px; margin-bottom: 50px; }

        .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .hub-card { background: var(--card-bg); border: 1px solid var(--border); padding: 40px 20px; border-radius: 20px; text-decoration: none; color: inherit; transition: 0.3s; }
        .hub-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .hub-card i { font-size: 40px; color: var(--accent); margin-bottom: 20px; display: block; }
        .hub-card h3 { font-size: 20px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <button class="sidebar-trigger" onclick="toggleSidebar()"><i class="fas fa-ellipsis-v"></i></button>
    <nav class="sidebar" id="sidebar">
        <ul class="nav-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="civil.html"><i class="fas fa-drafting-compass"></i> Civil Engineering</a></li>
            <li><a href="modeling.html"><i class="fas fa-cube"></i> 3D Modeling</a></li>
            <li><a href="webdev.html"><i class="fas fa-code"></i> Web Development</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Md. <span>Shaikh</span></h1>
        <p class="subtitle">Civil Engineering Student | 3D Modeler | Developer</p>
        
        <div class="hub-grid">
            <a href="civil.html" class="hub-card">
                <i class="fas fa-hard-hat"></i>
                <h3>Civil Engineering</h3>
            </a>
            <a href="modeling.html" class="hub-card">
                <i class="fas fa-dice-d20"></i>
                <h3>3D Modeling</h3>
            </a>
            <a href="webdev.html" class="hub-card">
                <i class="fas fa-laptop-code"></i>
                <h3>Web Development</h3>
            </a>
        </div>
    </div>
    <script>function toggleSidebar(){document.getElementById('sidebar').classList.toggle('active');}</script>
</body>
</html>
