<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Modeling | Md. Shaikh Alam</title>
<meta name="description" content="3D modeling, Blender practice, rigging and animation work by Md. Shaikh Alam.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--blue:#2563eb;
--blue-dark:#1d4ed8;
--surface:#ffffff;
--surface-soft:#f8fafc;
--line:#e2e8f0;
--ink:#0f172a;
--muted:#64748b;
--radius:8px;
--radius-lg:14px;
--shadow:0 4px 10px rgba(0,0,0,.08);
--shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,Arial,sans-serif;
background:#f5f7fb;
color:var(--ink);
line-height:1.6;
}
a{text-decoration:none}
img{max-width:100%}
.site-header{
position:sticky;
top:0;
z-index:100;
background:#fff;
border-bottom:1px solid var(--line);
}
.nav-shell{
max-width:1200px;
margin:auto;
padding:14px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}
.brand{
display:flex;
align-items:center;
gap:12px;
font-weight:800;
color:var(--ink);
}
.brand img{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
}
.site-nav{
display:flex;
gap:16px;
align-items:center;
}
.site-nav a{
padding:10px 14px;
border-radius:10px;
color:var(--ink);
font-weight:700;
}
.site-nav a:hover{
background:#eef3ff;
color:var(--blue);
}
.page{
max-width:1200px;
margin:auto;
padding:40px 20px;
}
.page-title{
margin-bottom:40px;
}
.eyebrow{
color:var(--blue);
font-size:13px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.08em;
margin-bottom:10px;
}
.page-title h1{
font-size:52px;
margin-bottom:14px;
}
.lead{
max-width:700px;
color:var(--muted);
font-size:18px;
}
.stats-bar{
display:flex;
gap:30px;
margin-top:25px;
flex-wrap:wrap;
}
.stat-item{
background:#fff;
padding:18px 24px;
border-radius:14px;
box-shadow:var(--shadow);
}
.stat-num{
font-size:34px;
font-weight:900;
color:var(--blue);
display:block;
}
.stat-label{
font-size:12px;
font-weight:700;
text-transform:uppercase;
letter-spacing:.06em;
color:var(--muted);
}
.section{
margin-top:50px;
}
.section-head-row{
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:20px;
margin-bottom:24px;
}
.filter-bar{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.filter-btn{
padding:10px 18px;
border:none;
border-radius:999px;
background:#fff;
color:var(--muted);
font-weight:700;
cursor:pointer;
box-shadow:var(--shadow);
}
.filter-btn.active{
background:var(--blue);
color:#fff;
}
.btn{
border:none;
cursor:pointer;
padding:11px 18px;
border-radius:10px;
font-weight:700;
display:inline-flex;
align-items:center;
gap:8px;
}
.btn.primary{
background:var(--blue);
color:#fff;
}
.btn.secondary{
background:#fff;
color:var(--ink);
box-shadow:var(--shadow);
}
#works-container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:24px;
}
.work-card{
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);
position:relative;
transition:.25s;
}
.work-card:hover{
transform:translateY(-5px);
box-shadow:var(--shadow-lg);
}
.work-thumb-wrap{
position:relative;
overflow:hidden;
}
.work-thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
}
.play-badge{
position:absolute;
top:12px;
right:12px;
background:#ff0000;
color:#fff;
padding:6px 10px;
border-radius:8px;
font-size:12px;
font-weight:700;
}
.work-actions{
position:absolute;
top:12px;
left:12px;
display:none;
gap:10px;
}
body.admin-mode .work-actions{
display:flex;
}
.work-action-btn{
width:38px;
height:38px;
border:none;
border-radius:10px;
background:#fff;
box-shadow:var(--shadow);
cursor:pointer;
font-size:15px;
}
.edit-btn{color:var(--blue)}
.del-btn{color:#ef4444}
.work-body{
padding:20px;
}
.work-cat{
display:inline-block;
padding:6px 12px;
border-radius:999px;
background:#eef3ff;
color:var(--blue);
font-size:11px;
font-weight:800;
text-transform:uppercase;
margin-bottom:12px;
}
.work-title{
font-size:22px;
font-weight:800;
margin-bottom:10px;
}
.work-desc{
color:var(--muted);
margin-bottom:18px;
}
.work-footer{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}
.work-link{
font-weight:700;
color:var(--blue);
}
.admin-fab{
position:fixed;
right:25px;
bottom:25px;
width:58px;
height:58px;
border:none;
border-radius:50%;
background:var(--ink);
color:#fff;
font-size:18px;
box-shadow:var(--shadow-lg);
cursor:pointer;
z-index:999;
}
.admin-fab.active{
background:var(--blue);
}
.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:9999;
}
.modal-overlay.open{
opacity:1;
pointer-events:auto;
}
.modal-box{
background:#fff;
width:100%;
max-width:650px;
border-radius:18px;
overflow:hidden;
transform:translateY(20px);
transition:.25s;
}
.modal-overlay.open .modal-box{
transform:translateY(0);
}
.modal-head{
padding:20px 24px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid var(--line);
}
.modal-body{
padding:24px;
max-height:70vh;
overflow:auto;
}
.modal-footer{
padding:18px 24px;
border-top:1px solid var(--line);
display:flex;
justify-content:flex-end;
gap:10px;
}
.modal-close{
width:40px;
height:40px;
border:none;
border-radius:10px;
background:#f1f5f9;
cursor:pointer;
}
.form-group{
margin-bottom:18px;
}
.form-group label{
display:block;
margin-bottom:8px;
font-size:13px;
font-weight:800;
text-transform:uppercase;
color:var(--muted);
}
.form-group input,
.form-group textarea,
.form-group select{
width:100%;
padding:13px 15px;
border:1px solid var(--line);
border-radius:12px;
background:#fff;
font-size:15px;
}
.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}
.thumb-preview{
margin-top:14px;
display:none;
border-radius:14px;
overflow:hidden;
}
.thumb-preview.show{
display:block;
}
.thumb-preview img{
width:100%;
display:block;
}
.works-empty{
background:#fff;
padding:80px 20px;
border-radius:20px;
text-align:center;
grid-column:1/-1;
}
.site-footer{
margin-top:70px;
padding:25px;
text-align:center;
background:#fff;
border-top:1px solid var(--line);
}
@media(max-width:768px){
.site-nav{
display:none;
}
.page-title h1{
font-size:40px;
}
.form-row{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<header class="site-header">
<div class="nav-shell">
<a class="brand" href="#">
<img src="assets/images/shaikh.png" alt="Shaikh">
<div>
<div>Md. Shaikh Alam</div>
<small>Portfolio and tools</small>
</div>
</a>
<nav class="site-nav">
<a href="index.html"><i class="fas fa-house"></i> Home</a>
<a href="civil.html"><i class="fas fa-helmet-safety"></i> Civil</a>
<a href="modeling.html"><i class="fas fa-cube"></i> 3D</a>
</nav>
</div>
</header>

<main class="page">

<section class="page-title">
<p class="eyebrow">Blender · 3D Modeling · Animation</p>
<h1>3D Portfolio</h1>
<p class="lead">Renders, rigging and animation experiments — updated as I learn.</p>

<div class="stats-bar">
<div class="stat-item">
<span class="stat-num" id="stat-total">0</span>
<span class="stat-label">Projects</span>
</div>

<div class="stat-item">
<span class="stat-num" id="stat-renders">0</span>
<span class="stat-label">Renders</span>
</div>

<div class="stat-item">
<span class="stat-num" id="stat-videos">0</span>
<span class="stat-label">Videos</span>
</div>
</div>
</section>

<section class="section">

<div class="section-head-row">
<h2>All Works</h2>

<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
<div class="filter-bar" id="filter-bar">
<button class="filter-btn active" data-cat="all">All</button>
</div>

<button class="btn primary" id="add-work-btn">
<i class="fas fa-plus"></i>
Add Project
</button>
</div>
</div>

<div id="works-container"></div>
</section>

</main>

<footer class="site-footer">
Md. Shaikh Alam · Blender modeling and animation practice
</footer>

<button class="admin-fab" id="admin-fab">
<i class="fas fa-lock" id="admin-fab-icon"></i>
</button>

<div class="modal-overlay" id="modal-work">
<div class="modal-box">

<div class="modal-head">
<h3 id="work-modal-title">Add Project</h3>
<button class="modal-close" data-close="modal-work">
<i class="fas fa-times"></i>
</button>
</div>

<div class="modal-body">

<input type="hidden" id="edit-id">

<div class="form-row">
<div class="form-group">
<label>Project Title</label>
<input type="text" id="w-title">
</div>

<div class="form-group">
<label>Category</label>
<select id="w-cat">
<option value="Render">Render</option>
<option value="Animation">Animation</option>
<option value="Rigging">Rigging</option>
<option value="Tutorial">Tutorial</option>
<option value="Shader">Shader</option>
<option value="Other">Other</option>
</select>
</div>
</div>

<div class="form-group">
<label>Description</label>
<textarea id="w-desc"></textarea>
</div>

<div class="form-row">
<div class="form-group">
<label>Tool</label>
<input type="text" id="w-tool">
</div>

<div class="form-group">
<label>External Link</label>
<input type="url" id="w-link">
</div>
</div>

<div class="form-group">
<label>Thumbnail URL</label>
<input type="url" id="w-img-url">

<div class="thumb-preview" id="thumb-preview">
<img id="thumb-preview-img" src="">
</div>
</div>

</div>

<div class="modal-footer">
<button class="btn secondary" data-close="modal-work">
Cancel
</button>

<button class="btn primary" id="save-work-btn">
Save Project
</button>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
setDoc,
doc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDHzrA90SIuUIoPEuVGrMpc2OlpT8dbFrM",
authDomain: "shaikh-portfolio.firebaseapp.com",
projectId: "shaikh-portfolio",
storageBucket: "shaikh-portfolio.firebasestorage.app",
messagingSenderId: "132917714279",
appId: "1:132917714279:web:d03261e67ec77b21f063c2",
measurementId: "G-C6T7CCS4EH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "md.shaikh.alam.007@gmail.com";

let adminMode = false;
let worksData = [];
let activeFilter = 'all';

function applyAdmin(){
document.body.classList.toggle('admin-mode',adminMode);

document.getElementById('admin-fab')
.classList.toggle('active',adminMode);

document.getElementById('admin-fab-icon').className=
adminMode
? 'fas fa-lock-open'
: 'fas fa-lock';
}

onAuthStateChanged(auth,(user)=>{

if(user && user.email===ADMIN_EMAIL){
adminMode=true;
}else{
adminMode=false;
}

applyAdmin();
});

async function adminLogin(){

const email=prompt('Enter Admin Email');

if(!email)return;

const password=prompt('Enter Admin Password');

if(!password)return;

try{

const userCredential=
await signInWithEmailAndPassword(
auth,
email,
password
);

const user=userCredential.user;

if(user.email!==ADMIN_EMAIL){

await signOut(auth);

alert('Access denied');

return;
}

alert('Admin login successful');

}catch(err){
console.error(err);
alert('Wrong email or password');
}
}

async function adminLogout(){
try{
await signOut(auth);
alert('Logged out successfully');
}catch(err){
console.error(err);
}
}

document.getElementById('admin-fab')
.addEventListener('click',async()=>{

if(adminMode){
await adminLogout();
return;
}

await adminLogin();
});

async function fetchWorks(){

try{

const snap=
await getDocs(collection(db,'works'));

worksData=[];

snap.forEach(d=>{
worksData.push(d.data());
});

worksData.sort((a,b)=>b.timestamp-a.timestamp);

renderWorks();

}catch(err){
console.error(err);
}
}

function buildFilters(){

const cats=[
'all',
...new Set(
worksData
.map(w=>w.cat)
.filter(Boolean)
)
];

const bar=document.getElementById('filter-bar');

bar.innerHTML=cats.map(c=>`
<button
class="filter-btn${c===activeFilter?' active':''}"
data-cat="${c}">
${c==='all'?'All':c}
</button>
`).join('');

bar.querySelectorAll('.filter-btn')
.forEach(btn=>{

btn.addEventListener('click',()=>{
activeFilter=btn.dataset.cat;
renderWorks();
});

});
}

function renderWorks(){

const filtered=
activeFilter==='all'
? worksData
: worksData.filter(w=>w.cat===activeFilter);

const container=
document.getElementById('works-container');

document.getElementById('stat-total').textContent=
worksData.length;

document.getElementById('stat-renders').textContent=
worksData.filter(w=>w.cat==='Render').length;

document.getElementById('stat-videos').textContent=
worksData.filter(w=>w.link).length;

buildFilters();

if(!filtered.length){
container.innerHTML=`
<div class="works-empty">
<h3>No projects found</h3>
</div>
`;
return;
}

const cards=filtered.map(w=>{

const hasVideo=
w.link &&
(
w.link.includes('youtube') ||
w.link.includes('youtu.be')
);

return `
<div class="work-card" data-id="${w.id}">

<div class="work-thumb-wrap">

<img
class="work-thumb"
src="${esc(w.img)}"
alt="${esc(w.title)}">

${hasVideo
? `
<div class="play-badge">
<i class="fab fa-youtube"></i>
Video
</div>
`
: ''
}

</div>

<div class="work-actions">

<button
class="work-action-btn edit-btn"
data-id="${w.id}">
<i class="fas fa-pen"></i>
</button>

<button
class="work-action-btn del-btn"
data-id="${w.id}">
<i class="fas fa-trash"></i>
</button>

</div>

<div class="work-body">

<div class="work-cat">
${esc(w.cat)}
</div>

<div class="work-title">
${esc(w.title)}
</div>

<div class="work-desc">
${esc(w.desc)}
</div>

<div class="work-footer">

<div>
<i class="fas fa-cube"></i>
${esc(w.tool)}
</div>

${w.link
? `
<a
class="work-link"
href="${esc(w.link)}"
target="_blank">
Open
</a>
`
: ''
}

</div>

</div>

</div>
`;

});

container.innerHTML=cards.join('');

container.querySelectorAll('.edit-btn')
.forEach(btn=>{
btn.addEventListener('click',()=>{
openEditModal(btn.dataset.id);
});
});

container.querySelectorAll('.del-btn')
.forEach(btn=>{
btn.addEventListener('click',()=>{
deleteWork(btn.dataset.id);
});
});
}

function resetForm(){

['w-title','w-desc','w-tool','w-link','w-img-url','edit-id']
.forEach(id=>{
document.getElementById(id).value='';
});

}

document.getElementById('add-work-btn')
.addEventListener('click',()=>{

if(!adminMode){
alert('Admin login required');
return;
}

resetForm();
openModal('modal-work');
});

function openEditModal(id){

const w=worksData.find(x=>x.id===id);

if(!w)return;

openModal('modal-work');

document.getElementById('edit-id').value=w.id;
document.getElementById('w-title').value=w.title;
document.getElementById('w-desc').value=w.desc;
document.getElementById('w-tool').value=w.tool;
document.getElementById('w-link').value=w.link;
document.getElementById('w-img-url').value=w.img;
document.getElementById('w-cat').value=w.cat;
}

document.getElementById('w-img-url')
.addEventListener('input',function(){

if(this.value.trim()){

document.getElementById('thumb-preview')
.classList.add('show');

document.getElementById('thumb-preview-img')
.src=this.value.trim();
}
});

document.getElementById('save-work-btn')
.addEventListener('click',async()=>{

if(!adminMode){
alert('Unauthorized');
return;
}

const title=
document.getElementById('w-title').value.trim();

if(!title){
alert('Title required');
return;
}

const editId=
document.getElementById('edit-id').value;

const id=editId || Date.now().toString();

const work={
id,
title,
desc:document.getElementById('w-desc').value.trim(),
cat:document.getElementById('w-cat').value,
tool:document.getElementById('w-tool').value.trim(),
link:document.getElementById('w-link').value.trim(),
img:document.getElementById('w-img-url').value.trim(),
timestamp:Date.now()
};

try{

await setDoc(doc(db,'works',id),work);

closeModal('modal-work');

fetchWorks();

}catch(err){
console.error(err);
alert('Failed to save');
}
});

async function deleteWork(id){

if(!adminMode){
alert('Unauthorized');
return;
}

if(!confirm('Delete this project?'))return;

try{
await deleteDoc(doc(db,'works',id));
fetchWorks();
}catch(err){
console.error(err);
}
}

function esc(s){
return String(s||'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;');
}

function openModal(id){
document.getElementById(id)
.classList.add('open');
}

function closeModal(id){
document.getElementById(id)
.classList.remove('open');
}

document.querySelectorAll('[data-close]')
.forEach(btn=>{
btn.addEventListener('click',()=>{
closeModal(btn.dataset.close);
});
});

fetchWorks();

</script>

</body>
</html>
