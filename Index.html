<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEC Index Generator | Lab Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --ink: #111827;
            --muted: #475569;
            --line: #cbd5e1;
            --paper: #ffffff;
            --panel: #ffffff;
            --soft: #f8fafc;
            --accent: #3b82f6;
            --shadow: rgba(15, 23, 42, 0.06);
            --bangla-font: "Noto Serif Bengali", "Noto Sans Bengali", "Hind Siliguri", "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--bangla-font);
            background: #edf2f7;
            color: var(--ink);
            padding: 24px;
            margin: 0;
            text-rendering: geometricPrecision;
        }

        .app {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* --- Panel Style (Matched with Question Builder) --- */
        .panel {
            background: var(--panel);
            border: 1px solid #d9e2ec;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 25px var(--shadow);
            position: sticky;
            top: 16px;
            max-height: calc(100vh - 32px);
            overflow: auto;
        }

        .panel h1 {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 1.2;
            font-family: Cambria, serif;
            color: var(--ink);
        }

        .lead { margin: 0 0 20px; font-size: 13px; color: var(--muted); line-height: 1.5; }

        /* Form Elements */
        .field { margin-bottom: 12px; }
        .field label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; }
        .field input, .field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            background: #fff;
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Buttons (Matched with Question Builder) */
        .btn-group { 
            background: #f8fafc; 
            padding: 15px; 
            border-radius: 14px; 
            border: 1px solid var(--line);
            margin-bottom: 20px;
            display: grid;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn-primary { background: #111827; color: #fff; width: 100%; }
        .btn-primary:hover { opacity: 0.9; }
        
        .btn-secondary { background: #eaf2ff; color: #1d4ed8; border: 1px solid #bfdbfe; font-size: 12px; }
        .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; width: 100%; margin-top: 10px; }

        /* Interactive List */
        .exp-list-container {
            border: 1px dashed var(--line);
            padding: 10px;
            border-radius: 12px;
            background: #f8fafc;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .exp-item {
            background: white;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        /* --- Preview Area --- */
        .page-wrap { display: flex; flex-direction: column; align-items: center; }
        
        .page {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 25mm 20mm;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .index-title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; }
        .index-title span { border-bottom: 2px solid #000; padding-bottom: 4px; }

        .index-table { 
            width: 100%; border-collapse: separate; border-spacing: 0; 
            border-top: 1px solid #000; border-left: 1px solid #000;
            flex: 1;
        }
        .index-table th, .index-table td { 
            border-right: 1px solid #000; border-bottom: 1px solid #000;
            padding: 8px; text-align: center; font-size: 12pt;
        }
        .col-name { text-align: left !important; width: 50%; }

        .watermark { position: absolute; bottom: 10mm; left: 15mm; font-size: 8pt; color: rgba(0,0,0,0.1); font-family: monospace; }
        
        @media print {
            body { padding: 0; background: #fff; }
            .panel { display: none; }
            .app { display: block; }
            .page { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="app">
        <aside class="panel">
            <h1>Index Generator</h1>
            <p class="lead">ফরিদপুর ইঞ্জিনিয়ারিং কলেজের ল্যাব রিপোর্টের জন্য প্রফেশনাল ইনডেক্স তৈরি করুন।</p>

            <div class="field">
                <input type="text" id="in_user_reg" placeholder="Reg No. (Required for Watermark)" style="border: 2px solid #3b82f6; text-align: center; font-weight: bold;" oninput="updatePreview()">
            </div>

            <div class="exp-list-container" id="control-list">
                <div style="color: #64748b; text-align: center; font-size: 12px;">No experiments added yet.</div>
            </div>

            <div class="btn-group">
                <div class="row">
                    <button class="btn-secondary" onclick="adjustTableFont(1)">+ Font Size</button>
                    <button class="btn-secondary" onclick="adjustTableFont(-1)">- Font Size</button>
                </div>
                <button class="btn-danger" onclick="resetAll()">Reset All Data</button>
            </div>

            <div class="field">
                <label>Experiment Name</label>
                <input type="text" id="in_name" placeholder="Type name here...">
            </div>
            <div class="row">
                <div class="field">
                    <label>Start Page</label>
                    <input type="number" id="in_page_start" value="1">
                </div>
                <div class="field">
                    <label>End Page</label>
                    <input type="number" id="in_page_end" placeholder="Opt">
                </div>
            </div>

            <button class="btn-primary" onclick="addExperiment()" style="margin-top: 10px;">+ Add to Index</button>
            <button class="btn-primary" onclick="generatePDF()" style="margin-top: 10px; background: #059669;">↓ Download PDF</button>
        </aside>

        <main class="page-wrap">
            <div class="page" id="index-page">
                <div class="watermark" id="out_watermark"></div>
                <h1 class="index-title"><span>Index</span></h1>
                
                <table class="index-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">No.</th>
                            <th class="col-name">Name of Experiment</th>
                            <th style="width: 15%;">Page No.</th>
                            <th style="width: 15%;">Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="out_table_body">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let experiments = [];
        let fontSize = 12;

        function addExperiment() {
            const name = document.getElementById('in_name').value;
            const start = document.getElementById('in_page_start').value;
            const end = document.getElementById('in_page_end').value;
            
            if (!name) return alert("Enter experiment name");

            experiments.push({ name, page: end ? `${start}-${end}` : start });
            document.getElementById('in_name').value = '';
            document.getElementById('in_name').focus();
            
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('out_table_body');
            const list = document.getElementById('control-list');
            tbody.innerHTML = '';
            list.innerHTML = '';

            experiments.forEach((exp, i) => {
                const row = `<tr>
                    <td>${String(i+1).padStart(2, '0')}</td>
                    <td class="col-name">${exp.name}</td>
                    <td>${exp.page}</td>
                    <td></td>
                </tr>`;
                tbody.innerHTML += row;

                list.innerHTML += `<div class="exp-item">
                    <span><b>${i+1}.</b> ${exp.name}</span>
                    <button class="btn-secondary" onclick="removeExp(${i})" style="padding: 2px 8px; color: red;">✕</button>
                </div>`;
            });
            updatePreview();
        }

        function removeExp(i) { experiments.splice(i, 1); renderTable(); }
        function adjustTableFont(amt) { fontSize += amt; document.querySelectorAll('.index-table td, .index-table th').forEach(el => el.style.fontSize = fontSize + 'pt'); }
        function updatePreview() { document.getElementById('out_watermark').innerText = document.getElementById('in_user_reg').value; }
        function resetAll() { if(confirm("Clear all?")) { experiments = []; renderTable(); } }

        function generatePDF() {
            const element = document.getElementById('index-page');
            const opt = { margin: 0, filename: 'FEC-Index.pdf', image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 3 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
